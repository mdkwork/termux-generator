name: Generate Termux application

on:
  workflow_dispatch:
    inputs:
      # ---------- Fork / identity ----------
      type:
        description: "Termux project to fork."
        required: false
        type: choice
        options: [f-droid, play-store]
        default: f-droid

      name:
        description: "Custom Android application ID (e.g. com.example.termux). Leave empty to use the default."
        required: false
        type: string

      user-path:
        description: "Custom TERMUX_APP__USER_PATH (absolute path inside the app). Leave empty for default."
        required: false
        type: string

      # ---------- Bootstrap ----------
      add:
        description: "Extra packages to include in the bootstrap, comma-separated (e.g. git,python,nodejs)."
        required: false
        type: string

      architectures:
        description: "Bootstrap architectures, comma-separated. Allowed: aarch64,arm,x86_64,i686. Leave empty for all."
        required: false
        type: string

      bootstrap-second-stage:
        description: "Run termux-bootstrap-second-stage.sh automatically after bootstrap extraction."
        required: false
        type: boolean
        default: true

      ssh-server:
        description: "Bundle an SSH server (default password: changeme)."
        required: false
        type: boolean
        default: false

      # ---------- Component selection ----------
      bootstrap:
        description: "Build the bootstrap archive(s)."
        required: false
        type: boolean
        default: true
      terminal:
        description: "Build the Terminal app."
        required: false
        type: boolean
        default: true
      tasker:
        description: "Build the Tasker add-on app."
        required: false
        type: boolean
        default: true
      float:
        description: "Build the Float add-on app."
        required: false
        type: boolean
        default: true
      widget:
        description: "Build the Widget add-on app."
        required: false
        type: boolean
        default: true
      api:
        description: "Build the API add-on app."
        required: false
        type: boolean
        default: true
      boot:
        description: "Build the Boot add-on app."
        required: false
        type: boolean
        default: true
      styling:
        description: "Build the Styling add-on app."
        required: false
        type: boolean
        default: true
      gui:
        description: "Build the GUI add-on app."
        required: false
        type: boolean
        default: true
      x11:
        description: "Build the X11 add-on app."
        required: false
        type: boolean
        default: true

      plugin:
        description: "Plugin to build. See build-termux.sh --help for accepted values."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Assemble build arguments
        env:
          IN_ADD:           ${{ inputs.add }}
          IN_NAME:          ${{ inputs.name }}
          IN_USER_PATH:     ${{ inputs.user-path }}
          IN_TYPE:          ${{ inputs.type }}
          IN_ARCHITECTURES: ${{ inputs.architectures }}
          IN_2ND_STAGE:     ${{ inputs.bootstrap-second-stage }}
          IN_SSH:           ${{ inputs.ssh-server }}
          IN_BOOTSTRAP:     ${{ inputs.bootstrap }}
          IN_TERMINAL:      ${{ inputs.terminal }}
          IN_TASKER:        ${{ inputs.tasker }}
          IN_FLOAT:         ${{ inputs.float }}
          IN_WIDGET:        ${{ inputs.widget }}
          IN_API:           ${{ inputs.api }}
          IN_BOOT:          ${{ inputs.boot }}
          IN_STYLING:       ${{ inputs.styling }}
          IN_GUI:           ${{ inputs.gui }}
          IN_X11:           ${{ inputs.x11 }}
          IN_PLUGIN:        ${{ inputs.plugin }}
        run: |
          set -euo pipefail

          # --- validation: fail fast with a clear message ---
          if [[ -n "$IN_NAME" && ! "$IN_NAME" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "::error::Invalid package name '$IN_NAME'"
            exit 1
          fi
          if [[ -n "$IN_ARCHITECTURES" && ! "$IN_ARCHITECTURES" =~ ^(aarch64|arm|x86_64|i686)(,(aarch64|arm|x86_64|i686))*$ ]]; then
            echo "::error::Invalid architectures '$IN_ARCHITECTURES'"
            exit 1
          fi
          if [[ -n "$IN_USER_PATH" && "$IN_USER_PATH" != /* ]]; then
            echo "::error::user-path must be absolute (got '$IN_USER_PATH')"
            exit 1
          fi

          # --- build the argument list ---
          args=()
          [[ -n "$IN_ADD"           ]] && args+=(--add "$IN_ADD")
          [[ -n "$IN_NAME"          ]] && args+=(--name "$IN_NAME")
          [[ -n "$IN_USER_PATH"     ]] && args+=(--user-path "$IN_USER_PATH")
          [[ -n "$IN_TYPE"          ]] && args+=(--type "$IN_TYPE")
          [[ -n "$IN_ARCHITECTURES" ]] && args+=(--architectures "$IN_ARCHITECTURES")
          [[ "$IN_2ND_STAGE" == "false" ]] && args+=(--disable-bootstrap-second-stage)
          [[ "$IN_SSH"       == "true"  ]] && args+=(--enable-ssh-server)
          [[ "$IN_BOOTSTRAP" == "false" ]] && args+=(--disable-bootstrap)
          [[ "$IN_TERMINAL"  == "false" ]] && args+=(--disable-terminal)
          [[ "$IN_TASKER"    == "false" ]] && args+=(--disable-tasker)
          [[ "$IN_FLOAT"     == "false" ]] && args+=(--disable-float)
          [[ "$IN_WIDGET"    == "false" ]] && args+=(--disable-widget)
          [[ "$IN_API"       == "false" ]] && args+=(--disable-api)
          [[ "$IN_BOOT"      == "false" ]] && args+=(--disable-boot)
          [[ "$IN_STYLING"   == "false" ]] && args+=(--disable-styling)
          [[ "$IN_GUI"       == "false" ]] && args+=(--disable-gui)
          [[ "$IN_X11"       == "false" ]] && args+=(--disable-x11)
          [[ -n "$IN_PLUGIN" ]] && args+=(--plugin "$IN_PLUGIN")

          echo "Build arguments: ${args[*]:-(none)}"

          # persist across steps; printf %q keeps quoting safe
          {
            echo "BUILD_ARGS<<EOF"
            printf '%q ' "${args[@]}"
            echo
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build Termux
        run: ./build-termux.sh $BUILD_ARGS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: Termux APKs or bootstraps
          path: |
            ./*.apk
            ./*.zip
            ./*.xz
