name: Generate Termux application

on:
  workflow_dispatch:
    inputs:
      # ---------- Fork / identity ----------
      type:
        description: "Termux project to fork."
        required: false
        type: choice
        options: [f-droid, play-store]
        default: f-droid

      name:
        description: "Custom Android application ID (e.g. com.example.termux). Leave empty to use the default."
        required: false
        type: string

      user-path:
        description: "Custom TERMUX_APP__USER_PATH (absolute path inside the app). Leave empty for default."
        required: false
        type: string

      # ---------- Bootstrap ----------
      add:
        description: "Extra packages to include in the bootstrap, comma-separated (e.g. git,python,nodejs)."
        required: false
        type: string

      bootstrap-second-stage:
        description: "Run termux-bootstrap-second-stage.sh automatically after bootstrap extraction."
        required: false
        type: boolean
        default: true

      ssh-server:
        description: "Bundle an SSH server (default password: changeme)."
        required: false
        type: boolean
        default: false

      # ---------- Bootstrap architectures ----------
      architecture-all:
        description: "Build all architectures (aarch64, arm, x86_64, i686). Checking any individual box below overrides this."
        required: false
        type: boolean
        default: true

      architecture-aarch64:
        description: "Build aarch64 (ARM64). Overrides 'architecture-all' when checked."
        required: false
        type: boolean
        default: false

      architecture-arm:
        description: "Build arm (ARMv7). Overrides 'architecture-all' when checked."
        required: false
        type: boolean
        default: false

      architecture-x86_64:
        description: "Build x86_64. Overrides 'architecture-all' when checked."
        required: false
        type: boolean
        default: false

      architecture-i686:
        description: "Build i686 (x86 32-bit). Overrides 'architecture-all' when checked."
        required: false
        type: boolean
        default: false

      # ---------- Component selection ----------
      bootstrap:
        description: "Build the bootstrap archive(s)."
        required: false
        type: boolean
        default: true
      terminal:
        description: "Build the Terminal app."
        required: false
        type: boolean
        default: true
      tasker:
        description: "Build the Tasker add-on app."
        required: false
        type: boolean
        default: true
      float:
        description: "Build the Float add-on app."
        required: false
        type: boolean
        default: true
      widget:
        description: "Build the Widget add-on app."
        required: false
        type: boolean
        default: true
      api:
        description: "Build the API add-on app."
        required: false
        type: boolean
        default: true
      boot:
        description: "Build the Boot add-on app."
        required: false
        type: boolean
        default: true
      styling:
        description: "Build the Styling add-on app."
        required: false
        type: boolean
        default: true
      gui:
        description: "Build the GUI add-on app."
        required: false
        type: boolean
        default: true
      x11:
        description: "Build the X11 add-on app."
        required: false
        type: boolean
        default: true

      plugin:
        description: "Plugin to build. See build-termux.sh --help for accepted values."
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Assemble build arguments
        env:
          # identity
          IN_ADD:           ${{ inputs.add }}
          IN_NAME:          ${{ inputs.name }}
          IN_USER_PATH:     ${{ inputs.user-path }}
          IN_TYPE:          ${{ inputs.type }}
          # architectures
          IN_ARCH_ALL:      ${{ inputs.architecture-all }}
          IN_ARCH_AARCH64:  ${{ inputs.architecture-aarch64 }}
          IN_ARCH_ARM:      ${{ inputs.architecture-arm }}
          IN_ARCH_X86_64:   ${{ inputs.architecture-x86_64 }}
          IN_ARCH_I686:     ${{ inputs.architecture-i686 }}
          # bootstrap options
          IN_2ND_STAGE:     ${{ inputs.bootstrap-second-stage }}
          IN_SSH:           ${{ inputs.ssh-server }}
          # component toggles
          IN_BOOTSTRAP:     ${{ inputs.bootstrap }}
          IN_TERMINAL:      ${{ inputs.terminal }}
          IN_TASKER:        ${{ inputs.tasker }}
          IN_FLOAT:         ${{ inputs.float }}
          IN_WIDGET:        ${{ inputs.widget }}
          IN_API:           ${{ inputs.api }}
          IN_BOOT:          ${{ inputs.boot }}
          IN_STYLING:       ${{ inputs.styling }}
          IN_GUI:           ${{ inputs.gui }}
          IN_X11:           ${{ inputs.x11 }}
          IN_PLUGIN:        ${{ inputs.plugin }}
        run: |
          set -euo pipefail

          # ---------- validation: fail fast with a clear message ----------
          if [[ -n "$IN_NAME" && ! "$IN_NAME" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "::error::Invalid package name '$IN_NAME' (must be a valid Android application ID)."
            exit 1
          fi
          if [[ -n "$IN_USER_PATH" && "$IN_USER_PATH" != /* ]]; then
            echo "::error::user-path must be absolute (got '$IN_USER_PATH')."
            exit 1
          fi

          # ---------- resolve architecture selection ----------
          # Rule: any checked individual architecture overrides 'architecture-all'.
          archs=()
          [[ "$IN_ARCH_AARCH64" == "true" ]] && archs+=(aarch64)
          [[ "$IN_ARCH_ARM"     == "true" ]] && archs+=(arm)
          [[ "$IN_ARCH_X86_64"  == "true" ]] && archs+=(x86_64)
          [[ "$IN_ARCH_I686"    == "true" ]] && archs+=(i686)

          if [[ ${#archs[@]} -gt 0 ]]; then
            if [[ "$IN_ARCH_ALL" == "true" ]]; then
              echo "::warning::Individual architecture(s) selected; 'architecture-all' is being ignored."
            fi
          elif [[ "$IN_ARCH_ALL" == "true" ]]; then
            archs=(aarch64 arm x86_64 i686)
          else
            echo "::error::No architectures selected. Check 'architecture-all' or at least one individual architecture."
            exit 1
          fi

          IN_ARCHITECTURES="$(IFS=,; echo "${archs[*]}")"
          echo "Selected architectures: $IN_ARCHITECTURES"

          # ---------- assemble the argument list ----------
          args=()
          if [[ -n "$IN_ADD"       ]]; then args+=(--add "$IN_ADD"); fi
          if [[ -n "$IN_NAME"      ]]; then args+=(--name "$IN_NAME"); fi
          if [[ -n "$IN_USER_PATH" ]]; then args+=(--user-path "$IN_USER_PATH"); fi
          if [[ -n "$IN_TYPE"      ]]; then args+=(--type "$IN_TYPE"); fi
          args+=(--architectures "$IN_ARCHITECTURES")
          if [[ "$IN_2ND_STAGE" == "false" ]]; then args+=(--disable-bootstrap-second-stage); fi
          if [[ "$IN_SSH"       == "true"  ]]; then args+=(--enable-ssh-server); fi
          if [[ "$IN_BOOTSTRAP" == "false" ]]; then args+=(--disable-bootstrap); fi
          if [[ "$IN_TERMINAL"  == "false" ]]; then args+=(--disable-terminal); fi
          if [[ "$IN_TASKER"    == "false" ]]; then args+=(--disable-tasker); fi
          if [[ "$IN_FLOAT"     == "false" ]]; then args+=(--disable-float); fi
          if [[ "$IN_WIDGET"    == "false" ]]; then args+=(--disable-widget); fi
          if [[ "$IN_API"       == "false" ]]; then args+=(--disable-api); fi
          if [[ "$IN_BOOT"      == "false" ]]; then args+=(--disable-boot); fi
          if [[ "$IN_STYLING"   == "false" ]]; then args+=(--disable-styling); fi
          if [[ "$IN_GUI"       == "false" ]]; then args+=(--disable-gui); fi
          if [[ "$IN_X11"       == "false" ]]; then args+=(--disable-x11); fi
          if [[ -n "$IN_PLUGIN" ]]; then args+=(--plugin "$IN_PLUGIN"); fi

          echo "Build arguments: ${args[*]:-(none)}"

          # ---------- persist to subsequent steps (quoting-safe) ----------
          {
            echo "BUILD_ARGS<<EOF"
            printf '%q ' "${args[@]}"
            echo
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build Termux
        run: ./build-termux.sh $BUILD_ARGS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: Termux APKs or bootstraps
          path: |
            ./*.apk
            ./*.zip
            ./*.xz
