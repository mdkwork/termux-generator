name: Generate Termux application

on:
  workflow_dispatch:
    inputs:
      add:
        description: "Include additional packages in bootstrap in a comma-separated list."
        required: false
      name:
        description: "Specify TERMUX_APP__PACKAGE_NAME name."
        required: false
      display-name:
        description: "Specify visible app display name."
        required: false
      user-path:
        description: "Specify TERMUX_APP__USER_PATH path."
        required: false
      type:
        description: "Specify the Termux project to fork [f-droid, play-store]. Defaults to f-droid."
        required: false
      architectures:
        description: "Specify the bootstrap architectures to include in a comma-separated list [aarch64,arm,x86_64,i686]."
        required: false
      bootstrap-second-stage:
        description: "Automatically execute termux-bootstrap-second-stage.sh."
        required: false
        type: boolean
        default: true
      ssh-server:
        description: "Bundle an SSH server with the default password 'changeme'."
        required: false
        type: boolean
      bootstrap:
        description: "Build the bootstrap(s)."
        required: false
        type: boolean
        default: true
      terminal:
        description: "Build the Terminal app."
        required: false
        type: boolean
        default: true
      tasker:
        description: "Build the Tasker addon app."
        required: false
        type: boolean
        default: true
      float:
        description: "Build the Float addon app."
        required: false
        type: boolean
        default: true
      widget:
        description: "Build the Widget addon app."
        required: false
        type: boolean
        default: true
      api:
        description: "Build the API addon app."
        required: false
        type: boolean
        default: true
      boot:
        description: "Build the Boot addon app."
        required: false
        type: boolean
        default: true
      styling:
        description: "Build the Styling addon app."
        required: false
        type: boolean
        default: true
      gui:
        description: "Build the GUI addon app."
        required: false
        type: boolean
        default: true
      x11:
        description: "Build the X11 addon app."
        required: false
        type: boolean
        default: true
      plugin:
        description: "Specify plugin."
        required: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      INPUT_ADD: ${{ inputs.add }}
      INPUT_NAME: ${{ inputs.name }}
      INPUT_DISPLAY_NAME: ${{ inputs.display-name }}
      INPUT_USER_PATH: ${{ inputs.user-path }}
      INPUT_TYPE: ${{ inputs.type }}
      INPUT_ARCHITECTURES: ${{ inputs.architectures }}
      INPUT_BOOTSTRAP_SECOND_STAGE: ${{ inputs.bootstrap-second-stage }}
      INPUT_SSH_SERVER: ${{ inputs.ssh-server }}
      INPUT_BOOTSTRAP: ${{ inputs.bootstrap }}
      INPUT_TERMINAL: ${{ inputs.terminal }}
      INPUT_TASKER: ${{ inputs.tasker }}
      INPUT_FLOAT: ${{ inputs.float }}
      INPUT_WIDGET: ${{ inputs.widget }}
      INPUT_API: ${{ inputs.api }}
      INPUT_BOOT: ${{ inputs.boot }}
      INPUT_STYLING: ${{ inputs.styling }}
      INPUT_GUI: ${{ inputs.gui }}
      INPUT_X11: ${{ inputs.x11 }}
      INPUT_PLUGIN: ${{ inputs.plugin }}
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Build Termux
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$INPUT_ADD" ]]; then args+=(--add "$INPUT_ADD"); fi
          if [[ -n "$INPUT_NAME" ]]; then args+=(--name "$INPUT_NAME"); fi
          if [[ -n "$INPUT_DISPLAY_NAME" ]]; then args+=(--display-name "$INPUT_DISPLAY_NAME"); fi
          if [[ -n "$INPUT_USER_PATH" ]]; then args+=(--user-path "$INPUT_USER_PATH"); fi
          if [[ -n "$INPUT_TYPE" ]]; then args+=(--type "$INPUT_TYPE"); fi
          if [[ -n "$INPUT_ARCHITECTURES" ]]; then args+=(--architectures "$INPUT_ARCHITECTURES"); fi
          if [[ "$INPUT_BOOTSTRAP_SECOND_STAGE" == "false" ]]; then args+=(--disable-bootstrap-second-stage); fi
          if [[ "$INPUT_SSH_SERVER" == "true" ]]; then args+=(--enable-ssh-server); fi
          if [[ "$INPUT_BOOTSTRAP" == "false" ]]; then args+=(--disable-bootstrap); fi
          if [[ "$INPUT_TERMINAL" == "false" ]]; then args+=(--disable-terminal); fi
          if [[ "$INPUT_TASKER" == "false" ]]; then args+=(--disable-tasker); fi
          if [[ "$INPUT_FLOAT" == "false" ]]; then args+=(--disable-float); fi
          if [[ "$INPUT_WIDGET" == "false" ]]; then args+=(--disable-widget); fi
          if [[ "$INPUT_API" == "false" ]]; then args+=(--disable-api); fi
          if [[ "$INPUT_BOOT" == "false" ]]; then args+=(--disable-boot); fi
          if [[ "$INPUT_STYLING" == "false" ]]; then args+=(--disable-styling); fi
          if [[ "$INPUT_GUI" == "false" ]]; then args+=(--disable-gui); fi
          if [[ "$INPUT_X11" == "false" ]]; then args+=(--disable-x11); fi
          if [[ -n "$INPUT_PLUGIN" ]]; then args+=(--plugin "$INPUT_PLUGIN"); fi
          ./build-termux.sh "${args[@]}"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.0
        with:
          name: Termux APKs or bootstraps
          path: |
            ./*.apk
            ./*.zip
            ./*.xz
